# Fallback: if MyFridge.xcodeproj does not open in your Xcode, install XcodeGen
# (brew install xcodegen) and run `xcodegen` in this folder. It recreates
# MyFridge.xcodeproj with the same settings.
name: MyFridge
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).myfridge
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MyFridge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - MyFridge.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).myfridge
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/MyFridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: My Fridge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: FridgeWidgetExtension
  FridgeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - FridgeWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).myfridge.widget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Widget/FridgeWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: My Fridge
        SKIP_INSTALL: YES
