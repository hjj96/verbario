# XcodeGen spec for the Apple targets of the MAYDAY native port (PLAN §2.1, §9).
#   xcodegen generate --spec rescue-apple/project.yml      (→ rescue-apple/Mayday.xcodeproj)
#
# SwiftPM (Core/Package.swift, builds on Linux): CJSMath, MaydayCore (+ CMaydayDSP, MaydaySynth later).
#   The package sits in the child directory Core/: Xcode rejects a local package that is an ancestor of
#   the project ("cannot be a direct ancestor of the project"), and this file's directory holds the
#   generated Mayday.xcodeproj. First Mac step after `xcodegen generate`:
#     xcodebuild -resolvePackageDependencies -project rescue-apple/Mayday.xcodeproj
# Xcode (this file, Apple only):
#   Mayday-iOS / Mayday-macOS  app targets that both compile
#       Sources/MaydayApp     shared app code (GameHost, MetalView, RootView, the game session over MaydayCore's
#                             systems, input adapters, haptics, settings storage)
#       Sources/MaydayRender  the Metal renderer: Swift + .metal → the app's default.metallib
#       Sources/AppIOS | Sources/AppMac   platform entry point, Info.plist, privacy manifest
#     and link the local package product MaydayCore.
#   MaydayRenderTests          macOS unit tests hosted by Mayday-macOS (ShaderTypes layout, ocean self-test,
#                              render goldens vs the web: Tests/Goldens, tools/export/render-goldens.mjs).
# MaydayAudio / MaydayUI / MaydayUITests join when their sources exist (M3 / M5).
# Shaders: Sources/MaydayRender/Shaders/**/*.metal (MTL_FAST_MATH = NO, Metal 3.1 — Configs/Base.xcconfig,
# pinned again in `settings` below); check after generating:
#   xcodebuild -project Mayday.xcodeproj -target Mayday-macOS -showBuildSettings | grep MTL_FAST_MATH   → NO
# ShaderTypes.h reaches Swift as `import MaydayShaderTypes` through SWIFT_INCLUDE_PATHS.
name: Mayday

options:
  bundleIdPrefix: app.mayday
  developmentLanguage: ru
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: ""
    # PLAN §3.1 rule 5 (ANGLE parity: NaN/Inf, pow/exp/normalize precision). Same values as
    # Configs/Base.xcconfig, pinned here because project-level buildSettings outrank the project's
    # xcconfig: XcodeGen's base preset carries Xcode's new-project `MTL_FAST_MATH: YES`. XcodeGen
    # (2.46) already drops a preset key that the configFiles define, but this pin does not depend on
    # that behaviour. Target presets do not touch MTL_*.
    MTL_FAST_MATH: NO
    MTL_LANGUAGE_REVISION: Metal31

packages:
  Mayday:
    path: Core

targets:
  Mayday-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/MaydayApp
      - path: Sources/MaydayRender
        excludes:
          - "Shaders/module.modulemap"
      - path: Sources/AppIOS
      # the whole Resources/ tree as one folder reference → <bundle resources>/Resources/{Data,Textures,…}
      # (MaydayCore DataCatalog resolves the manifest paths "Resources/Data/…" from there)
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: Mayday
        product: MaydayCore
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
    settings:
      base:
        PRODUCT_NAME: MAYDAY
        PRODUCT_MODULE_NAME: MaydayApp
        PRODUCT_BUNDLE_IDENTIFIER: app.mayday.game
        INFOPLIST_FILE: Sources/AppIOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      commandLineArguments:
        "-mayday.debug YES": false
        "-mayday.quality high": false
        "-mayday.weather storm": false
        "-mayday.dynres NO": false

  Mayday-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/MaydayApp
      - path: Sources/MaydayRender
        excludes:
          - "Shaders/module.modulemap"
      - path: Sources/AppMac
      # the whole Resources/ tree as one folder reference → <bundle resources>/Resources/{Data,Textures,…}
      # (MaydayCore DataCatalog resolves the manifest paths "Resources/Data/…" from there)
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: Mayday
        product: MaydayCore
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
    settings:
      base:
        PRODUCT_NAME: MAYDAY
        PRODUCT_MODULE_NAME: MaydayApp
        PRODUCT_BUNDLE_IDENTIFIER: app.mayday.game.mac
        INFOPLIST_FILE: Sources/AppMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/AppMac/Mayday.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - MaydayRenderTests
      commandLineArguments:
        "-mayday.debug YES": false
        "-mayday.quality medium": false
        "-mayday.weather nightStorm": false
        "-mayday.dynres NO": false

  MaydayRenderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MaydayRenderTests
      # render-goldens.mjs output as one folder reference → <test bundle>/Resources/Goldens (the sandboxed
      # macOS test host cannot read the source tree; GoldenSupport.swift looks here first)
      - path: Tests/Goldens
        type: folder
        buildPhase: resources
    dependencies:
      - target: Mayday-macOS
      # Build-only (not linked: the code lives in the host app, BUNDLE_LOADER resolves it). Without
      # it `@testable import MaydayApp` fails with "missing required module 'CJSMath'": MaydayApp's
      # interface imports MaydayCore, which imports the package's C module CJSMath, and Xcode only
      # hands a package's module maps to targets that depend on the package.
      - package: Mayday
        product: MaydayCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mayday.render-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MAYDAY.app/Contents/MacOS/MAYDAY"
        BUNDLE_LOADER: "$(TEST_HOST)"
